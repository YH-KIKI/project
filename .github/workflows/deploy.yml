name: CI/CD with Docker (Spring + FastAPI)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Spring+React 이미지 빌드/푸시
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./project_react
          file: ./project_react/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/yummyplanet-frontend:latest
      
      # 2. 백엔드(Spring) 이미지 빌드/푸시
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./project_java
          file: ./project_java/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # 2. FastAPI 이미지 빌드/푸시 (context 경로 주의)
      - name: Build FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: ./project_python # FastAPI 소스 경로
          file: ./project_python/Dockerfile # Dockerfile의 정확한 경로
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-server:latest

      # 4. EC2 접속 및 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
            sudo docker network create app-network || true

            # AI 서버 실행
            sudo docker stop ai-server || true
            sudo docker rm ai-server || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ai-server:latest
            sudo docker run -d --name ai-server --network app-network \
              -p 8000:8000 \
              -e GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
              ${{ secrets.DOCKER_USERNAME }}/ai-server:latest

            # Spring Boot 실행 (포트 개방 안함, 내부망에만 존재)
            sudo docker stop backend-server || true
            sudo docker rm backend-server || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest
            sudo docker run -d --name backend-server --network app-network \
              -p 8080:8080 \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e AI_SERVER_URL="${{ secrets.AI_SERVER_URL }}" \
              -e STATIC_PATH="file:///app/uploads/" \
              -e UPLOAD_PATH="/app/uploads/bodycam/" \
              -e RELEARN_PATH="/app/uploads/relearn/" \
              ${{ secrets.DOCKER_USERNAME }}/backend:latest \
              java -Xmx512m -Dspring.profiles.active=prod -jar /app.jar.jar

            # Nginx(React) 실행 (80 포트 개방)
            sudo docker stop frontend-server || true
            sudo docker rm frontend-server || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/yummyplanet-frontend:latest
            sudo docker run -d --name frontend-server --network app-network \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/yummyplanet-frontend:latest

            sudo docker image prune -f
