server {
    listen 80;

    # 1. React 정적 파일 서빙 (CORS 문제 없음)
    location / {
			root /usr/share/nginx/html;
			index index.html index.htm;
			# React Router를 위해 새로고침 시 index.html로 돌려보내는 설정
			try_files $uri $uri/ /index.html;
    }

    # 2. Spring Boot API 리버스 프록시
    # /api 로 시작하는 요청은 스프링 부트(backend-server)로 전달
    location /api {
			# 자동 배포에서 부트 컨테이너 네임을 backend-server로 설정해야 함
			proxy_pass http://yummyplanet-backend:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

		# 3. FastAPI로 요청 전달
    location /ai/ {
			# 자동 배포에서 fast api 컨테이너 네임을 ai-server로 설정해야 함
			proxy_pass http://yummyplanet-ai:8000/;
			proxy_set_header Host $host;
    }
}