spring.application.name=project_java
spring.thymeleaf.cache=false
spring.datasource.hikari.username=${DB_USERNAME:root}
spring.datasource.hikari.password=${DB_PASSWORD:root}
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.jdbc-url=jdbc:mysql://${DB_URL:localhost}:3306/yummy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

spring.web.resources.static-locations=${STATIC_PATH:file:///C:/uploads/}
spring.mvc.static-path-pattern=/uploads/**

project.relearn.path=${RELEARN_PATH:C:/uploads/relearn/}




