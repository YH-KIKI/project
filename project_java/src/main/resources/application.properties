spring.application.name=project_java
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yummy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.hikari.jdbc-url=jdbc:mysql://localhost:3306/nnp?useSSL=false&serverTimezone=Asia/Seoul // 연결문제로 변경
#spring.datasource.hikari.jdbc-url=jdbc:mysql://localhost:3306/yummy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

spring.web.resources.static-locations=file:///C:/project_uploads/
spring.mvc.static-path-pattern=/uploads/**

# [추가] 재학습용 폴더 경로 AWS로 가면 이 부분만 리눅스 경로로 바꾸면 끝
project.relearn.path=C:/project_uploads/relearn/

